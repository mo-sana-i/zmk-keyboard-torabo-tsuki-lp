CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900

CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- BLE安定化（USB/Studio + split 同時接続時のリンク落ち対策）---
# ACLバッファを251へ拡大 → DATA_LENGTH 244 を許可（既定69だと範囲外で弾かれる）
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=244

# L2CAP/ACL TXバッファ & ワークキュー/スタックの拡大（枯渇によるフリーズ/切断対策）
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
